# Render blueprint. Deploy: push to GitHub -> Render dashboard -> "New +" ->
# "Blueprint" -> pick this repo. Fill the sync:false secrets when prompted;
# they are never stored in the repo.
services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Full browser cookie header (preferred). See .env.example.
      - key: LI_COOKIE_STRING
        sync: false
      # Optional residential/mobile proxy. The SDUI path has held from Render's
      # datacenter IP with just the cookie; add this only for sustained volume
      # or if the host starts getting 401s. Leave unset to egress directly.
      - key: OUTBOUND_PROXY
        sync: false
