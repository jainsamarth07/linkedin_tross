# Render blueprint. Deploy: push to GitHub -> Render dashboard -> "New +" ->
# "Blueprint" -> pick this repo. Fill the sync:false secrets when prompted;
# they are never stored in the repo.
services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Full browser cookie header (preferred). See .env.example.
      - key: LI_COOKIE_STRING
        sync: false
      # Residential/mobile proxy — required on Render: a datacenter IP gets
      # the LinkedIn session killed quickly without it.
      - key: OUTBOUND_PROXY
        sync: false
